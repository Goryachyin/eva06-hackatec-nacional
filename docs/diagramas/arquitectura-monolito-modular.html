  <ellipse cx="330" cy="572" rx="210" ry="22" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
  <text x="330" y="626" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#0f172a">
    Base de datos
  </text>
  <text x="330" y="650" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#475569">
    Expedientes, estados, resúmenes y auditoría
  </text>

  <!-- Cilindro 2: Bus de datos y tiempo real -->
  <path d="M 620 572 L 620 662 A 210 22 0 0 0 1040 662 L 1040 572 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <ellipse cx="830" cy="572" rx="210" ry="22" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
  <text x="830" y="626" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#0f172a">
    Bus de datos y tiempo real
  </text>
  <text x="830" y="650" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#475569">
    Colas, OTP, señalización WebRTC y SSE
  </text>
</svg>`.trim();

      // =========================================================================
      // ESTADO Y CONTROL DEL VISOR
      // =========================================================================
      const VIEWS = {
        tecnica: {
          svg: SVG_TECNICA,
          width: 1280,
          height: 1020,
          filename: 'monolito-modular-arquitectura-tecnica'
        },
        general: {
          svg: SVG_GENERAL,
          width: 1160,
          height: 740,
          filename: 'monolito-modular-arquitectura-general'
        }
      };

      const state = {
        activeView: 'tecnica',
        scale: 1,
        translateX: 0,
        translateY: 0,
        minScale: 0.2,
        maxScale: 3.5,
        isDragging: false,
        dragStartX: 0,
        dragStartY: 0,
        lastPinchDist: null,
        toastTimer: null
      };

      const dom = {
        viewport: document.getElementById('viewport'),
        transformLayer: document.getElementById('transform-layer'),
        svgStage: document.getElementById('svg-stage'),
        zoomReadout: document.getElementById('zoom-readout'),
        tabButtons: document.querySelectorAll('.tab-btn'),
        btnZoomIn: document.getElementById('btn-zoom-in'),
        btnZoomOut: document.getElementById('btn-zoom-out'),
        btnFit: document.getElementById('btn-fit'),
        btnExportSvg: document.getElementById('btn-export-svg'),
        btnExportPng: document.getElementById('btn-export-png'),
        toast: document.getElementById('toast')
      };

      function showToast(msg) {
        dom.toast.textContent = msg;
        dom.toast.classList.remove('opacity-0', 'translate-y-2');
        dom.toast.classList.add('opacity-100', 'translate-y-0');
        if (state.toastTimer) clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          dom.toast.classList.remove('opacity-100', 'translate-y-0');
          dom.toast.classList.add('opacity-0', 'translate-y-2');
        }, 2400);
      }

      function applyTransform() {
        dom.transformLayer.style.transform = `translate3d(${state.translateX}px, ${state.translateY}px, 0) scale(${state.scale})`;
        dom.zoomReadout.textContent = `${Math.round(state.scale * 100)}%`;
      }

      function clampScale(v) {
        return Math.min(state.maxScale, Math.max(state.minScale, v));
      }

      function fitToViewport() {
        const view = VIEWS[state.activeView];
        const vw = dom.viewport.clientWidth;
        const vh = dom.viewport.clientHeight;
        if (!vw || !vh) return;

        const pad = 64;
        const contentW = view.width + pad;
        const contentH = view.height + pad;

        const scaleX = (vw - 32) / contentW;
        const scaleY = (vh - 32) / contentH;
        const target = clampScale(Math.min(scaleX, scaleY, 1.0));

        state.scale = target;
        state.translateX = (vw - contentW * target) / 2;
        state.translateY = (vh - contentH * target) / 2;
        applyTransform();
      }

      function zoomAtPoint(newScale, clientX, clientY) {
        const clamped = clampScale(newScale);
        if (clamped === state.scale) return;

        const rect = dom.viewport.getBoundingClientRect();
        const cx = clientX - rect.left;
        const cy = clientY - rect.top;
        const ratio = clamped / state.scale;

        state.translateX = cx - (cx - state.translateX) * ratio;
        state.translateY = cy - (cy - state.translateY) * ratio;
        state.scale = clamped;
        applyTransform();
      }

      function zoomCenter(factor) {
        const rect = dom.viewport.getBoundingClientRect();
        zoomAtPoint(state.scale * factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      function switchView(viewId) {
        if (!VIEWS[viewId]) return;
        state.activeView = viewId;
        dom.svgStage.innerHTML = VIEWS[viewId].svg;

        dom.tabButtons.forEach((btn) => {
          const active = btn.dataset.view === viewId;
          btn.className = active
            ? 'tab-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-white text-slate-900 shadow-sm border border-slate-200 transition-all'
            : 'tab-btn px-3 py-1.5 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 border border-transparent transition-all';
        });

        requestAnimationFrame(() => fitToViewport());
      }

      // =========================================================================
      // EXPORTACIÓN A SVG Y PNG (3x ALTA RESOLUCIÓN)
      // =========================================================================
      function triggerDownload(url, filename) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function exportSvg() {
        const view = VIEWS[state.activeView];
        const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + view.svg;
        const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        triggerDownload(url, `${view.filename}.svg`);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        showToast(`SVG descargado: ${view.filename}.svg`);
      }

      function exportPng3x() {
        const view = VIEWS[state.activeView];
        const scale = 3;
        const canvas = document.createElement('canvas');
        canvas.width = view.width * scale;
        canvas.height = view.height * scale;

        const ctx = canvas.getContext('2d');
        const svgUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(view.svg);

        const img = new Image();
        img.onload = () => {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          triggerDownload(canvas.toDataURL('image/png'), `${view.filename}.png`);
          showToast(`PNG (3x) descargado: ${view.filename}.png`);
        };
        img.src = svgUri;
      }

      // =========================================================================
      // INTERACCIÓN (MOUSE, TÁCTIL Y TECLADO)
      // =========================================================================
      dom.viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        zoomAtPoint(state.scale * factor, e.clientX, e.clientY);
      }, { passive: false });

      dom.viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.closest('button')) return;
        state.isDragging = true;
        state.dragStartX = e.clientX - state.translateX;
        state.dragStartY = e.clientY - state.translateY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.isDragging) return;
        state.translateX = e.clientX - state.dragStartX;
        state.translateY = e.clientY - state.dragStartY;
        applyTransform();
      });

      window.addEventListener('mouseup', () => {
        state.isDragging = false;
      });

      dom.viewport.addEventListener('dblclick', (e) => {
        if (!e.target.closest('button')) fitToViewport();
      });

      dom.viewport.addEventListener('touchstart', (e) => {
        if (e.target.closest('button')) return;
        if (e.touches.length === 1) {
          state.isDragging = true;
          state.lastPinchDist = null;
          state.dragStartX = e.touches[0].clientX - state.translateX;
          state.dragStartY = e.touches[0].clientY - state.translateY;
        } else if (e.touches.length === 2) {
          state.isDragging = false;
          state.lastPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: false });

      dom.viewport.addEventListener('touchmove', (e) => {
        if (e.target.closest('button')) return;
        e.preventDefault();
        if (e.touches.length === 1 && state.isDragging) {
          state.translateX = e.touches[0].clientX - state.dragStartX;
          state.translateY = e.touches[0].clientY - state.dragStartY;
          applyTransform();
        } else if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (state.lastPinchDist) {
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            zoomAtPoint(state.scale * (dist / state.lastPinchDist), midX, midY);
          }
          state.lastPinchDist = dist;
        }
      }, { passive: false });

      dom.viewport.addEventListener('touchend', () => {
        state.isDragging = false;
        state.lastPinchDist = null;
      });

      dom.tabButtons.forEach((btn) => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
      });

      dom.btnZoomIn.addEventListener('click', () => zoomCenter(1.2));
      dom.btnZoomOut.addEventListener('click', () => zoomCenter(1 / 1.2));
      dom.btnFit.addEventListener('click', fitToViewport);
      dom.btnExportSvg.addEventListener('click', exportSvg);
      dom.btnExportPng.addEventListener('click', exportPng3x);

      window.addEventListener('keydown', (e) => {
        if (e.key === '+' || e.key === '=') zoomCenter(1.2);
        else if (e.key === '-') zoomCenter(1 / 1.2);
        else if (e.key === '0') fitToViewport();
      });

      window.addEventListener('resize', () => fitToViewport());
      window.addEventListener('load', () => switchView('tecnica'));
    })();
  </script>
</body>
</html>
